{% extends "base.html" %}
{% block title %}Autentificare{% endblock %}
{% block content %}
<div class="narrow card">
  <h1>{{ class_name }}</h1>
  <p class="muted">Autentifică-te pentru a vedea fondul clasei.</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Utilizator
      <input name="username" required autofocus autocomplete="username">
    </label>
    <label>Parolă
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <button class="btn">Intră în cont</button>
  </form>
</div>
{% endblock %}
