{% extends "base.html" %}
{% block title %}Modifică rechizitul{% endblock %}
{% block content %}
<div class="narrow card">
  <h1>Modifică rechizitul</h1>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Denumire <input name="name" required maxlength="100" value="{{ request.form.get('name', supply['name']) }}"></label>
    <label>Categorie
      <input name="category" list="supply-cats" maxlength="50" value="{{ request.form.get('category', supply['category']) }}">
      <datalist id="supply-cats">{% for c in categories %}<option value="{{ c }}">{% endfor %}</datalist>
    </label>
    <label>Preț (lei, opțional)
      <input name="price" inputmode="decimal" placeholder="ex: 45,50" value="{{ request.form.get('price', money_to_input(supply['price']) if supply['price'] else '') }}">
    </label>
    <label>Observații <input name="note" maxlength="300" value="{{ request.form.get('note', supply['note'] or '') }}"></label>
    <div class="row-actions">
      <button class="btn">Salvează</button>
      <a class="btn secondary" href="{{ url_for('supplies') }}">Renunță</a>
    </div>
  </form>
</div>
{% endblock %}
