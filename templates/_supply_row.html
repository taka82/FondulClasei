<tr>
  <td>
    <a class="item-name" href="{{ url_for('supply_detail', supply_id=s['id']) }}">{{ s['name'] }}</a>
    {% if s['note'] %}<span class="muted small block">{{ s['note'] }}</span>{% endif %}
  </td>
  <td><span class="tag">{{ s['category'] }}</span></td>
  <td class="num"><strong class="order">{{ s['chosen'] }}</strong>{% if total %} <span class="muted small">din {{ total }}</span>{% endif %}</td>
  <td class="num">{{ s['paid'] }}</td>
  <td class="num">{{ s['received'] }}</td>
  {% if not is_admin %}
  <td>
    {% set m = mine.get(s['id']) %}
    <span class="pips">
      <span class="pip {{ 'on chosen' if m and m['chosen'] }}" title="Ales">Ales</span>
      <span class="pip {{ 'on paid' if m and m['paid'] }}" title="Plătit">Plătit</span>
      <span class="pip {{ 'on received' if m and m['received'] }}" title="Primit">Primit</span>
    </span>
  </td>
  {% else %}
  <td class="actions nowrap">
    <a href="{{ url_for('supply_detail', supply_id=s['id']) }}">Bifează</a>
    <a href="{{ url_for('supply_edit', supply_id=s['id']) }}">Modifică</a>
    <form method="post" action="{{ url_for('supply_delete', supply_id=s['id']) }}" class="inline"
          onsubmit="return confirm('Ștergi rechizitul și bifele asociate?')">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <button class="link danger">Șterge</button>
    </form>
  </td>
  {% endif %}
</tr>
